name: iOS — screenshots + unsigned IPA

on:
  push:
    branches: [main]
    paths-ignore: ["research/**", "**/*.md", "docs/**", ".github/workflows/store-screenshots.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Blobby
  BUNDLE_ID: com.futureautomate.blobby

jobs:
  # One job = one cloud Mac (two parallel macOS jobs got stuck on GitHub capacity).
  build:
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write          # to publish screenshots to the ci-screenshots branch
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ids=[(k,x['udid'],x['name']) for k,v in d.items() if 'iOS' in k for x in v if x['name'] in ('iPhone 17 Pro','iPhone 16 Pro')]
          ids=ids or [(k,x['udid'],x['name']) for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(sorted(ids)[-1][1])")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Simulator: $UDID"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project "$SCHEME.xcodeproj" -scheme "$SCHEME" \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
            | grep -E "error:|warning: .*\.swift|BUILD (SUCCEEDED|FAILED)" || true
          test -d "build/Build/Products/Debug-iphonesimulator/$SCHEME.app"

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project "$SCHEME.xcodeproj" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos -destination generic/platform=iOS \
            -archivePath "build/$SCHEME.xcarchive" archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d "build/$SCHEME.xcarchive/Products/Applications/$SCHEME.app"
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/$SCHEME.xcarchive/Products/Applications/$SCHEME.app" Payload/
          zip -qry "$SCHEME-unsigned.ipa" Payload
          ls -lh "$SCHEME-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ipa-unsigned
          path: "*-unsigned.ipa"
          retention-days: 7
      - name: Unit tests (streaks, rest days, pause, levels, saved data)
        run: |
          set -o pipefail
          xcodebuild test -project "$SCHEME.xcodeproj" -scheme "$SCHEME" \
            -destination "id=$SIM_UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 \
            | grep -E "Test Case .*(passed|failed)|error:|Executed [0-9]+ test|TEST (SUCCEEDED|FAILED)"

      - name: Run demo screens and capture
        timeout-minutes: 15         # a hung simulator must not block anything
        continue-on-error: true
        run: |
          UDID="$SIM_UDID"
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true      # may already be booted by the tests
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" "build/Build/Products/Debug-iphonesimulator/$SCHEME.app"
          mkdir -p screenshots

          shot () {  # name, then launch args
            name=$1; shift
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" "$@"
            sleep 5
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          # v0.10 habit types: home with check-in + limit cards, check-in screen, limit screen, add with type picker
          shot t1-home-types -demo sample
          shot t2-checkin  -demo sample -open 1
          shot t3-limit    -demo sample -open 2
          shot t4-limit-night -demo sample -open 2 -night
          # v0.9.5 first-time hints
          shot h1-hint-log  -demo sample -hints
          shot h2-hint-night -demo sample -hints -night
          # core screens (older one-off checks removed to keep the step well under its time limit)
          shot r1-week     -demo sample -recap
          shot r2-month    -demo sample -recap -month
          # v0.9 night theme + big text
          shot n1-home     -demo sample -night
          shot n2-drop     -demo sample -open 0 -night
          shot n5-settings -demo sample -settings -night
          shot a1-bigtext  -demo sample -UIPreferredContentSizeCategoryName UICTContentSizeCategoryAccessibilityL
          shot 20-share    -demo sample -share
          shot 12-settings -demo sample -settings
          shot 2-home      -demo sample
          shot 3-drop      -demo sample -open 0
          shot 8-add       -demo sample -add
          shot 15-levelup  -demo sample -open 0 -levelup

          # short video of the logging animation (app auto-logs in -autolog mode)
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -demo sample -open 0 -autolog
          sleep 1
          xcrun simctl io "$UDID" recordVideo --codec h264 --force screenshots/9-logging.mp4 &
          REC=$!
          sleep 9
          kill -INT $REC; wait $REC || true
          ls -lh screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish screenshots to ci-screenshots branch
        continue-on-error: true
        run: |
          SHA=${GITHUB_SHA::7}
          cp -R screenshots /tmp/shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan ci-screenshots
          git rm -rfq . && git clean -fdxq
          cp /tmp/shots/* .
          echo "Screenshots for $SHA" > README.txt
          git add -A && git commit -qm "screenshots $SHA"
          git push -fq origin HEAD:ci-screenshots
