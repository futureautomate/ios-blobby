# Signed build → TestFlight. Run by hand: Actions → "Release to TestFlight" → Run workflow.
# Needs these repo secrets (Settings → Secrets and variables → Actions):
#   TEAM_ID        10-character Apple Team ID (developer.apple.com → Membership details)
#   ASC_KEY_ID     App Store Connect API key ID
#   ASC_ISSUER_ID  App Store Connect issuer ID
#   ASC_KEY_P8     full text of the AuthKey_XXXX.p8 file (key with Admin access, for cloud signing)
# No Mac and no certificates to manage: Xcode's automatic signing creates them using the API key.
name: Release to TestFlight

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  SCHEME: Blobby

jobs:
  testflight:
    runs-on: macos-26          # App Store uploads must be built with a current Xcode / iOS SDK
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; missing=1; fi
          done
          exit $missing

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Write API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Archive (signed)
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Build number = run number, so every upload is unique and increasing.
          xcodebuild -project "$SCHEME.xcodeproj" -scheme "$SCHEME" \
            -configuration Release -destination generic/platform=iOS \
            -archivePath "build/$SCHEME.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > archive.log 2>&1 || true
          grep -E "error:|warning: .*(sign|provision)|ARCHIVE (SUCCEEDED|FAILED)" archive.log || true
          grep -q "ARCHIVE SUCCEEDED" archive.log || { tail -40 archive.log; exit 1; }

      - name: Upload to TestFlight
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "build/$SCHEME.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1 || true
          grep -E "error:|Upload|EXPORT (SUCCEEDED|FAILED)" export.log || true
          grep -q "EXPORT SUCCEEDED" export.log || { tail -40 export.log; exit 1; }
          echo "Uploaded build ${{ github.run_number }}. It appears in TestFlight after Apple finishes processing (usually 5–30 min)."

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
