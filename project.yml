# XcodeGen spec — the .xcodeproj is generated from this on the cloud Mac (CI).
# Edit this file, never a .pbxproj, when working from Windows.
name: Blobby
options:
  bundleIdPrefix: com.futureautomate
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.11.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Blobby:
    type: application
    platform: iOS
    sources: [Blobby]
    scheme:
      testTargets: [BlobbyTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.futureautomate.blobby
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Blobby
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO   # no custom encryption: skips the export question on upload
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only for now; "1,2" adds iPad

  BlobbyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BlobbyTests]
    dependencies:
      - target: Blobby
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.futureautomate.blobby.tests

# Widget extension parked: Sideloadly + a free Apple ID strips App Groups, so the widget
# can't read the app's data. The code is kept in BlobbyWidget/ and Blobby/Shared/.
# To re-enable (Mac/Xcode or paid account): restore the BlobbyWidget target, the app's
# `dependencies: [target: BlobbyWidget]` and the App Group entitlements (see git history, v0.6.1).
